
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thesis-nginx
  namespace: default
  labels:
    app: thesis-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thesis-nginx
  template:
    metadata:
      labels:
        app: thesis-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

